<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cửa hàng Demo</title>
    <!--
      Trang mẫu đứng thay cho giao diện dự án của người dùng trong khung xem trước
      (src/screens/Run.tsx). Khi nối backend, iframe trỏ vào cổng thật của
      dự án đang chạy và tệp này không còn được dùng.
    -->
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #ffffff;
        color: #1f2328;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      }
      header {
        display: flex; align-items: center; gap: 14px;
        padding: 12px 18px; border-bottom: 1px solid #e7ebef;
      }
      .logo { width: 26px; height: 26px; border-radius: 7px; background: #1f6feb; }
      .brand { font-size: 14px; font-weight: 700; }
      nav { margin-left: auto; display: flex; align-items: center; gap: 14px; font-size: 12.5px; color: #4d5560; }
      .cart { position: relative; cursor: pointer; border: 1px solid #d8dee4; background: #f6f8fa; border-radius: 8px; padding: 5px 10px; font: inherit; color: #1f2328; }
      .badge { font-weight: 700; color: #1f6feb; }
      main { padding: 18px; }
      h1 { font-size: 15px; margin: 0 0 3px; }
      .sub { font-size: 12px; color: #5b636e; margin: 0 0 16px; }
      .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
      .card { border: 1px solid #e7ebef; border-radius: 11px; overflow: hidden; }
      .thumb { height: 74px; background: linear-gradient(135deg, #dbe6f5, #eef2f7); }
      .body { padding: 10px 11px 12px; }
      .name { font-size: 12.5px; font-weight: 600; }
      .price { font-size: 12px; color: #5b636e; margin-top: 3px; }
      .add {
        margin-top: 9px; width: 100%; cursor: pointer;
        border: 1px solid #cfd8e0; background: #ffffff; border-radius: 8px;
        padding: 6px 8px; font: inherit; font-size: 11.5px; font-weight: 600; color: #1f2328;
      }
      .add:hover { background: #f6f8fa; }
      .panel {
        position: absolute; right: 18px; top: 52px; width: 260px;
        background: #ffffff; border: 1px solid #d8dee4; border-radius: 11px;
        box-shadow: 0 8px 24px rgba(31, 35, 40, 0.12); padding: 12px; display: none;
      }
      .panel.open { display: block; }
      .panel h2 { font-size: 12.5px; margin: 0 0 8px; }
      .line { display: flex; justify-content: space-between; font-size: 12px; color: #4d5560; padding: 3px 0; }
      .total { border-top: 1px solid #e7ebef; margin-top: 7px; padding-top: 7px; font-weight: 700; color: #1f2328; }
      .pay { margin-top: 9px; width: 100%; cursor: pointer; border: 0; border-radius: 8px; background: #1f6feb; color: #fff; padding: 8px; font: inherit; font-size: 12px; font-weight: 600; }
      .done { font-size: 12px; color: #1a7f37; line-height: 1.5; }
      .empty { font-size: 12px; color: #6e7781; }
    </style>
  </head>
  <body>
    <header>
      <span class="logo"></span>
      <span class="brand">Cửa hàng Demo</span>
      <nav>
        <span>Sản phẩm</span>
        <button class="cart" id="cartBtn" type="button">
          Giỏ hàng <span class="badge" id="count">0</span>
        </button>
      </nav>
    </header>

    <div class="panel" id="panel">
      <h2>Giỏ hàng của bạn</h2>
      <div id="lines"><p class="empty">Chưa có sản phẩm nào.</p></div>
    </div>

    <main>
      <h1>Sản phẩm đang bán</h1>
      <p class="sub">Dữ liệu mẫu — giá và tên sản phẩm không phải dữ liệu thật.</p>
      <div class="grid" id="grid"></div>
    </main>

    <script>
      const PRODUCTS = [
        { name: 'Áo sơ mi trắng', price: 290000 },
        { name: 'Quần jeans xanh', price: 450000 },
        { name: 'Giày thể thao', price: 780000 },
        { name: 'Túi đeo chéo', price: 350000 },
      ];
      const cart = [];

      document.getElementById('grid').innerHTML = PRODUCTS.map(
        (p, i) => `
          <div class="card">
            <div class="thumb"></div>
            <div class="body">
              <div class="name">${p.name}</div>
              <div class="price">${p.price.toLocaleString('vi-VN')} đ</div>
              <button class="add" data-i="${i}" type="button">Thêm vào giỏ</button>
            </div>
          </div>`,
      ).join('');

      const money = (n) => n.toLocaleString('vi-VN') + ' đ';
      const panel = document.getElementById('panel');
      const lines = document.getElementById('lines');

      function render() {
        document.getElementById('count').textContent = String(cart.length);
        if (!cart.length) {
          lines.innerHTML = '<p class="empty">Chưa có sản phẩm nào.</p>';
          return;
        }
        const total = cart.reduce((s, p) => s + p.price, 0);
        lines.innerHTML =
          cart.map((p) => `<div class="line"><span>${p.name}</span><span>${money(p.price)}</span></div>`).join('') +
          `<div class="line total"><span>Tổng cộng</span><span>${money(total)}</span></div>` +
          '<button class="pay" id="pay" type="button">Thanh toán</button>';
        document.getElementById('pay').onclick = () => {
          cart.length = 0;
          render();
          lines.innerHTML = '<p class="done">Đã lưu đơn hàng vào cơ sở dữ liệu. Cảm ơn bạn!</p>';
        };
      }

      document.querySelectorAll('.add').forEach((b) => {
        b.onclick = () => {
          cart.push(PRODUCTS[Number(b.dataset.i)]);
          render();
        };
      });

      document.getElementById('cartBtn').onclick = () => panel.classList.toggle('open');
      render();
    </script>
  </body>
</html>
